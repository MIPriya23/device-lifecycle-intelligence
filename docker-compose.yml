  #     timeout: 10s
  #     retries: 15
  #     start_period: 40s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dli-api
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file: .env          # exposes SAT_CLIENT_ID, SAT_CLIENT_SECRET, LLM_MODEL, OPENAI_API_BASE
    networks:
      - dli-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: dli-ui
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - API_BACKEND=http://api:80
    depends_on:
      api:
        condition: service_started
    networks:
      - dli-network

# volumes:
#   mongo_data:  # disabled — no longer used

networks:
  dli-network:
    driver: bridge
