# Development override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Replaces the nginx production build with the Vite dev server so that
# any file saved under ui/src/ triggers instant HMR in the browser.

services:
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    # Mount source so edits on the host are immediately visible inside the container.
    # The named volume shields node_modules from being overwritten by the mount.
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Proxy target reachable via the shared Docker network
      VITE_API_URL: http://api:8000
    # Override the healthcheck — the Vite dev server doesn't serve /health
    healthcheck:
      disable: true

volumes:
  ui_node_modules:
