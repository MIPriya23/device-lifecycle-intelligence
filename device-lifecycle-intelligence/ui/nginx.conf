server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes DNS resolver injected at container startup by docker-entrypoint.sh
    resolver __KUBE_DNS__ valid=30s ipv6=off;

    # Health check
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the FastAPI service (dli-api in Kubernetes, api in Compose)
    location /api/ {
        set $backend __API_BACKEND__;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
